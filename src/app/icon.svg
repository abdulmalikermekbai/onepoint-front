<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151C"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D"/>
      <stop offset="100%" stop-color="#FF4500"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242836"/>
      <stop offset="100%" stop-color="#141722"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Laptop Display Frame -->
  <rect x="14" y="13" width="36" height="25" rx="3.5" fill="#2E3344" stroke="#41485D" stroke-width="1.5"/>
  <!-- Laptop Screen Area -->
  <rect x="16.5" y="15.5" width="31" height="20" rx="2" fill="url(#screenGrad)"/>

  <!-- Stylish Glowing Point / Accent Symbol (OnePoint Brand dot) -->
  <circle cx="32" cy="24" r="5" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="24" r="2" fill="#FFFFFF"/>

  <!-- Sleek Keyboard Base -->
  <path d="M7 42.5C7 40.5 8.5 39 10.5 39H53.5C55.5 39 57 40.5 57 42.5V44C57 46 55 48 52.5 48H11.5C9 48 7 46 7 44V42.5Z" fill="url(#accentGrad)"/>
  
  <!-- Base Highlight / Touchpad Notch -->
  <path d="M26 39H38V40.5C38 41.3 37.3 42 36.5 42H27.5C26.7 42 26 41.3 26 40.5V39Z" fill="#14151C"/>
</svg>
